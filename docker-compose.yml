version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: telemetry-postgres
    restart: always
    environment:
      POSTGRES_USER: sasori
      POSTGRES_PASSWORD: sasori
      POSTGRES_DB: telemetry_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: telemetry-api
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://sasori:sasori@db:5432/telemetry_db
      - PORT=8000
    ports:
      - "8000:8000"

volumes:
  postgres_data: